name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: tests that need the build (the three vendor scripts loaded in order)
        run: npm run test:built
      - name: extension/panel.js is built from extension/src/panel.ts and committed
        run: git diff --exit-code -- extension/panel.js || (echo "::error::extension/panel.js is out of date. Run 'npm run build' and commit it." && exit 1)
      - run: npm run lint:pkg
      - run: npm run build:ext
      - name: Firefox add-on lint (manifest and API compatibility)
        if: matrix.node == 22
        run: npx --yes web-ext lint --source-dir dist-extension/firefox --warnings-as-errors=false
      - uses: actions/upload-artifact@v4
        if: matrix.node == 22
        with:
          name: extension
          path: dist-extension/*.zip
  react-compat:
    # The default suite runs on React 19; the peer range claims 16.8+, so 18 and 17 run too.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:react18
      - run: npm run test:react17
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --prefix examples/vite-react install
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: A minified production build, named through its source map
        run: npm run e2e:prod
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
  e2e-next:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm --prefix examples/next install
      - run: npx playwright install --with-deps chromium
      - name: Next.js app + `rerender-lens/setup` + the relay panel (`npx rerender-lens panel`)
        run: npm run e2e:next
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-next
          path: playwright-report
  jest:
    # `rerender-lens/jest` against a real Jest run (test/jest/), so the integration cannot rot.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Jest app + `rerender-lens/jest/setup` + the reporter's budget (exit 1, then exit 0)
        run: npm run test:jest
