name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: extension/panel.js is built from extension/src/panel.ts and committed
        run: git diff --exit-code -- extension/panel.js || (echo "::error::extension/panel.js is out of date. Run 'npm run build' and commit it." && exit 1)
      - run: npm run lint:pkg
      - run: npm run build:ext
      - uses: actions/upload-artifact@v4
        if: matrix.node == 22
        with:
          name: extension
          path: dist-extension/*.zip
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --prefix examples/vite-react install
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
