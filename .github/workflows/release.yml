name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run check
      # A tag whose package.json version is already on npm (v0.3.3 and v0.3.4 both carried 0.3.0)
      # used to fail here and never reach the GitHub release. Publish only new versions; the
      # release with the extension zips is created either way.
      - name: Decide whether to publish
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "::warning::tag $GITHUB_REF_NAME does not match package.json version $VERSION (bump package.json before tagging)"
          fi
          if npm view "rerender-lens@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::rerender-lens@$VERSION is already on npm; skipping publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.publish == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist-extension/rerender-lens-chrome-*.zip
            dist-extension/rerender-lens-firefox-*.zip
            dist-extension/rerender-lens-edge-*.zip
      # Chrome Web Store upload. Create the four secrets from a Google Cloud OAuth client
      # (see extension/store/PUBLISHING.md); the step is skipped when they are not set.
      - name: Upload to Chrome Web Store
        if: env.CWS_EXTENSION_ID != ''
        env:
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          npx --yes chrome-webstore-upload-cli@3 upload \
            --source dist-extension/chrome.zip \
            --extension-id "$CWS_EXTENSION_ID" \
            --client-id "$CWS_CLIENT_ID" \
            --client-secret "$CWS_CLIENT_SECRET" \
            --refresh-token "$CWS_REFRESH_TOKEN"
