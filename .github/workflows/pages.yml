name: Docs
on:
  push:
    branches: [main]
    paths: ['README.md', 'extension/README.md', 'docs/**', 'scripts/*docs*.mjs', 'extension/src/panel.ts', 'package.json', '.github/workflows/pages.yml']
  # A release rebuilds the site with freshly captured screenshots, so they never show an old panel.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      capture:
        description: Recapture the screenshots before building
        type: boolean
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Requires Pages enabled in repo settings with source GitHub Actions - GITHUB_TOKEN cannot create the site.
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fresh screenshots (releases only)
        if: github.event_name == 'release' || inputs.capture
        run: |
          npm run build
          npx playwright install --with-deps chromium
          npm run docs:media
      - run: npm run build:docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
