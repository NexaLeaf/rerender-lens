name: Docs
on:
  push:
    branches: [main]
    paths: ['README.md', 'extension/README.md', 'docs/**', 'scripts/build-docs.mjs', 'package.json', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Requires Pages enabled in repo settings with source GitHub Actions - GITHUB_TOKEN cannot create the site.
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
